name: Critical E2E

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'supabase/**'
      - 'tests/e2e/**'
      - 'playwright.config.mjs'
      - '.github/workflows/e2e-critical.yml'
  workflow_dispatch:

concurrency:
  group: critical-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_AGENCY_EMAIL: e2e-agency@example.test
      E2E_AGENCY_PASSWORD: E2E-Password!42
      E2E_OPERATOR_EMAIL: e2e-operator@example.test
      E2E_OPERATOR_PASSWORD: E2E-Operator-Password!42
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Start minimal isolated Supabase stack
        run: supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Reset database from migrations and seed
        run: supabase db reset

      - name: Export local runtime credentials
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          echo "SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"

      - name: Seed deterministic E2E fixture
        run: node tests/e2e/setup-fixture.mjs

      - name: Install pinned Playwright runner
        run: npm install --no-save --package-lock=false @playwright/test@1.63.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run critical browser flow
        run: npx playwright test --config=playwright.config.mjs

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
