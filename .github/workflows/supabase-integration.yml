name: Supabase Integration

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'supabase/**'
      - 'tests/integration/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/supabase-integration.yml'
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Start isolated Supabase stack
        run: supabase start

      - name: Reset database from migrations and seed
        run: supabase db reset

      - name: Export local test credentials
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          echo "SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"

      - name: Run live RLS and RPC integration tests
        run: npm run test:integration

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
